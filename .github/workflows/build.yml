name: Focal Diagnostic APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: focal-debug-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'build/focal-debug-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply deterministic source repairs
        run: python scripts/repair_focal_build.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        shell: bash
        run: |
          mkdir -p build-logs
          set -o pipefail
          ./gradlew clean assembleDebug --stacktrace --no-daemon 2>&1 | tee build-logs/gradle.log

      - name: Commit verified source repairs
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/ai/sonario/app/data/Settings.kt \
            app/src/main/java/ai/sonario/app/source/SourceFetcher.kt \
            app/src/main/java/ai/sonario/app/ui/SummaryScreen.kt \
            app/src/main/java/ai/sonario/app/ui/SummaryViewModel.kt
          if ! git diff --cached --quiet; then
            git commit -m "fix: repair Focal debug APK compilation [skip ci]"
            git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          fi

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focal-gradle-log
          path: build-logs/gradle.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: focal-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
